; PlatformIO project for the ESP32 phone motion controller.
; The esp32 environments share all code; only the board differs. Pin
; differences live in include/config.h (selected by CONFIG_IDF_TARGET_*).
; `native` runs the hardware-free logic in lib/motion under `pio test`.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
; 3 MB app, no OTA (the default 1.31 MB app partition was 91% full).
board_build.partitions = huge_app.csv
lib_deps =
    lemmingdev/ESP32-BLE-Gamepad@^0.8.0
    hijelhub/HijelHID_BLEMouse@^0.1.0
    h2zero/NimBLE-Arduino@^2.3.8
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall
    -Wextra
    -Iinclude
    -DCORE_DEBUG_LEVEL=1
; The framework already passes -DCORE_DEBUG_LEVEL=0 to every compile unit;
; drop it so the level above is not a redefinition.
build_unflags =
    -DCORE_DEBUG_LEVEL=0

[env:esp32s3]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
lib_deps =
    lemmingdev/ESP32-BLE-Gamepad@^0.8.0
    hijelhub/HijelHID_BLEMouse@^0.1.0
    h2zero/NimBLE-Arduino@^2.3.8
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall
    -Wextra
    -Iinclude
    -DCORE_DEBUG_LEVEL=1
build_unflags =
    -DCORE_DEBUG_LEVEL=0

[env:native]
platform = native
build_flags =
    -Wall
    -Wextra
    -std=gnu++17
    -Iinclude
    -Ilib/motion
    -DUNIT_TEST
test_framework = unity