; PlatformIO project for the ESP32 phone motion controller.
; Two environments share all code; only the board differs. Pin differences
; live in include/config.h (selected by CONFIG_IDF_TARGET_*).

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
